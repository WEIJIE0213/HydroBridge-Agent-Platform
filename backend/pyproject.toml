[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrobridge-backend"
version = "1.0.0"
description = "HydroBridge AI multi-agent backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "alembic>=1.16,<2.0",
  "asyncmy>=0.2.10,<1.0",
  "aiosqlite>=0.21,<1.0",
  "redis[hiredis]>=6.2,<7.0",
  "httpx>=0.28,<1.0",
  "orjson>=3.10,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "structlog>=25.4,<26.0",
  "prometheus-client>=0.22,<1.0",
  "tenacity>=9.1,<10.0",
  "minio>=7.2,<8.0",
  "qdrant-client>=1.15,<2.0",
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-redis>=0.2,<1.0",
  "langchain-openai>=0.3,<2.0",
  "langchain-tavily>=0.2,<1.0",
  "celery[redis]>=5.5,<6.0",
  "trafilatura>=2.0,<3.0",
  "pymupdf>=1.26,<2.0",
  "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
production = [
  "gunicorn>=23.0,<24.0",
  "opentelemetry-api>=1.35,<2.0",
  "opentelemetry-sdk>=1.35,<2.0",
  "opentelemetry-exporter-otlp>=1.35,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.56b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.56b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.56b0,<1.0",
]
rag-local = [
  "FlagEmbedding>=1.3,<2.0",
  "sentence-transformers>=5.0,<6.0",
]
ocr = [
  "paddleocr>=3.1,<4.0",
  "paddlepaddle>=3.1,<4.0",
]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.2,<7.0",
  "fakeredis>=2.30,<3.0",
  "asgi-lifespan>=2.1,<3.0",
  "respx>=0.22,<1.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.16,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires containerized infrastructure",
  "live: requires real model and Tavily credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "S101",
  "S105",
  "S106",
  "RUF001",
  "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["alembic"]
