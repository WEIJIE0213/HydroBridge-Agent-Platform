name: hydrobridge-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydrobridge}
      POSTGRES_USER: ${POSTGRES_USER:-hydrobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis-runtime:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis-runtime-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-cache:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lfu
    ports:
      - "6381:6379"
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    build:
      context: ./infra/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  minio:
    build:
      context: ./infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-hydrobridge}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bge:
    build:
      context: ./infra/bge
    image: hydrobridge-ai-bge
    gpus: all
    environment:
      BGE_DEVICE: cuda
      BGE_MAX_LENGTH: 1024
      BGE_BATCH_SIZE: 8
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      start_period: 180s
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
      - path: ${USERPROFILE:-}/.continuum/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hydrobridge}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-hydrobridge}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_ANALYZER: ik_max_word
      RETRIEVAL_BACKEND: elasticsearch
      KNOWLEDGE_INDEX_VERSION: 4
      ELASTICSEARCH_INDEX: hydrobridge-chunks-bge-v4
      EMBEDDING_BACKEND: bge_service
      BGE_SERVICE_URL: http://bge:8080
    volumes:
      - ./backend:/app
      - ./seed-data:/seed-data:ro
      - ./evaluation:/evaluation
    depends_on:
      postgres:
        condition: service_healthy
      redis-runtime:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      bge:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.bootstrap &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
      - path: ${USERPROFILE:-}/.continuum/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hydrobridge}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-hydrobridge}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_ANALYZER: ik_max_word
      RETRIEVAL_BACKEND: elasticsearch
      KNOWLEDGE_INDEX_VERSION: 4
      ELASTICSEARCH_INDEX: hydrobridge-chunks-bge-v4
      EMBEDDING_BACKEND: bge_service
      BGE_SERVICE_URL: http://bge:8080
    volumes:
      - ./backend:/app
      - ./seed-data:/seed-data:ro
    depends_on:
      api:
        condition: service_healthy
    command: >-
      celery -A app.worker.celery_app worker
      --loglevel=INFO
      --concurrency=2
      --queues=celery,indexing,research,evaluation
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
      - path: ${USERPROFILE:-}/.continuum/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hydrobridge}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-hydrobridge}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_ANALYZER: ik_max_word
      RETRIEVAL_BACKEND: elasticsearch
      KNOWLEDGE_INDEX_VERSION: 4
      ELASTICSEARCH_INDEX: hydrobridge-chunks-bge-v4
      EMBEDDING_BACKEND: bge_service
      BGE_SERVICE_URL: http://bge:8080
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
    command: >-
      celery -A app.worker.celery_app beat
      --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-runtime-data:
  redis-cache-data:
  elasticsearch-data:
  minio-data:
